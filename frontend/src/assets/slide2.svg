<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0914"/>
      <stop offset="50%" stop-color="#141026"/>
      <stop offset="100%" stop-color="#080710"/>
    </linearGradient>
    <radialGradient id="infectedRbc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#BE123C" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#881337" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGlow2)"/>

  <!-- Reticle -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.35" stroke-dasharray="4,4">
    <circle cx="400" cy="225" r="180" fill="none" stroke="#8CED00" stroke-width="1" stroke-dasharray="2,4"/>
    <circle cx="400" cy="225" r="100" fill="none" stroke="#00E5D1" stroke-width="1" stroke-dasharray="2,4"/>
    <line x1="400" y1="0" x2="400" y2="450" stroke="#00E5D1" opacity="0.4"/>
    <line x1="0" y1="225" x2="800" y2="225" stroke="#00E5D1" opacity="0.4"/>
  </g>

  <!-- Normal RBCs -->
  <circle cx="180" cy="140" r="42" fill="url(#infectedRbc)" opacity="0.7"/>
  <circle cx="240" cy="310" r="45" fill="url(#infectedRbc)" opacity="0.7"/>
  <circle cx="580" cy="160" r="44" fill="url(#infectedRbc)" opacity="0.7"/>

  <!-- Infected RBC with Plasmodium falciparum Ring Stage -->
  <circle cx="400" cy="225" r="65" fill="url(#infectedRbc)" stroke="#F43F5E" stroke-width="2.5"/>
  <circle cx="400" cy="225" r="22" fill="#881337" opacity="0.6"/>

  <!-- Ring Form Parasite (Signet Ring Shape) -->
  <circle cx="380" cy="210" r="14" fill="none" stroke="#00E5D1" stroke-width="3.5"/>
  <circle cx="374" cy="204" r="5" fill="#8CED00" stroke="#00E5D1" stroke-width="1"/>

  <!-- Trophozoite Parasite Box -->
  <rect x="305" y="130" width="190" height="190" fill="none" stroke="#F43F5E" stroke-width="2.5" rx="10"/>
  <rect x="305" y="104" width="190" height="26" fill="#F43F5E" rx="4"/>
  <text x="312" y="121" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="900">P. falciparum RING [98.9%]</text>

  <g transform="translate(20, 20)">
    <rect width="240" height="60" fill="#0B0914" opacity="0.9" stroke="#F43F5E" stroke-width="1.5" rx="10"/>
    <text x="14" y="24" fill="#F43F5E" font-family="monospace" font-size="11" font-weight="900">DIAGNOSIS: POSITIVE (+ve)</text>
    <text x="14" y="44" fill="#94A3B8" font-family="monospace" font-size="10">Parasitemia Density: 2.4%</text>
  </g>

  <!-- Scale Bar -->
  <g transform="translate(640, 390)">
    <rect width="140" height="36" fill="#0B0914" opacity="0.85" stroke="#334155" rx="8"/>
    <line x1="20" y1="22" x2="80" y2="22" stroke="#FFFFFF" stroke-width="3"/>
    <text x="90" y="25" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold">10 µm</text>
  </g>
</svg>
