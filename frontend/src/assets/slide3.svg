<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="100%" stop-color="#12182B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGlow3)"/>

  <!-- Glass Slide Outer Rim -->
  <rect x="140" y="80" width="520" height="290" fill="#1E293B" stroke="#475569" stroke-width="2" rx="16"/>
  <rect x="160" y="100" width="100" height="250" fill="#0F172A" stroke="#334155" rx="8"/>
  <text x="172" y="140" fill="#94A3B8" font-family="monospace" font-size="10" font-weight="bold">SLIDE ID:</text>
  <text x="172" y="160" fill="#8CED00" font-family="monospace" font-size="11" font-weight="900">SMP000001</text>
  <text x="172" y="200" fill="#64748B" font-family="monospace" font-size="9">GIEMSA STAIN</text>
  <text x="172" y="218" fill="#64748B" font-family="monospace" font-size="9">THIN SMEAR</text>

  <!-- Slide Glass Area -->
  <rect x="280" y="100" width="360" height="250" fill="#0B132B" stroke="#00E5D1" stroke-width="1.5" rx="8"/>

  <!-- Scan Beam Rays -->
  <line x1="280" y1="210" x2="640" y2="210" stroke="#00E5D1" stroke-width="3" opacity="0.8"/>
  <polygon points="280,210 640,160 640,260" fill="#00E5D1" opacity="0.12"/>

  <!-- Microscopic Cells on Slide -->
  <circle cx="340" cy="170" r="16" fill="#F43F5E" opacity="0.7"/>
  <circle cx="420" cy="240" r="18" fill="#F43F5E" opacity="0.8"/>
  <circle cx="530" cy="180" r="20" fill="#6366F1" opacity="0.9"/>
  <circle cx="480" cy="280" r="15" fill="#F43F5E" opacity="0.7"/>

  <!-- Ingestion Telemetry -->
  <g transform="translate(300, 310)">
    <rect width="320" height="30" fill="#0F172A" stroke="#8CED00" stroke-width="1" rx="6"/>
    <text x="12" y="19" fill="#8CED00" font-family="monospace" font-size="11" font-weight="bold">SCANNER STATUS: 40x OPTICAL INGESTION COMPLETE</text>
  </g>
</svg>
