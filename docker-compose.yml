services:
  backend:
    build:
      context: ./backend
    container_name: labvision-backend

    ports:
      - "8001:8000"

    env_file:
      - ./backend/.env

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: labvision-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
