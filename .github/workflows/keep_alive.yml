name: Keep Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier sleep
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual run from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        run: |
          URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_APP_URL secret is not set. Defaulting to local placeholder or skipping."
            exit 0
          fi
          echo "Pinging $URL..."
          curl -I -s -o /dev/null -w "Status Code: %{http_code}\n" "$URL"
